[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lhc-kk-tower-audit"
version = "1.0.0"
description = "Bayesian and Multiplicity Audit of LHC Kaluza-Klein Multi-Resonance Claims"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
